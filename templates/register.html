<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Smart Habit Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#000080;
position:relative;
}

.carousel-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.carousel-bg img{
height:100vh;
object-fit:cover;
filter:brightness(60%);
}

</style>
</head>


<body class="d-flex flex-column min-vh-100">

<div id="habitCarousel" class="carousel slide carousel-fade carousel-bg" data-bs-ride="carousel" data-bs-interval="4000">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://img.freepik.com/premium-photo/portrait-young-female-artist-painting-picture-her-studio_1029322-5726.jpg" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://img.freepik.com/premium-photo/2-man-fighting-punching-sports-boxing_978521-38756.jpg" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438" class="d-block w-100">
</div>

</div>
</div>


<nav class="navbar navbar-dark" style="background:#2563EB;">
<div class="container-fluid">
<a class="navbar-brand fs-1" href="/">SmartHabit</a>
</div>
</nav>


<div class="container-fluid mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow p-4 fs-1">

<h3 class="text-center mb-4 fs-1">Create Account</h3>

<form action="/register" method="POST">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" name="name" class="form-control fs-1" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control fs-1" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control fs-1" required>
</div>

<button type="submit" class="btn btn-success w-100 fs-1">
Register
</button>

<div class="text-center mt-3">
<p>Already have an account? <a href="/login">Login</a></p>
</div>

</form>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
